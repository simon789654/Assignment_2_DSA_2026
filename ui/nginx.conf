# Serves the UI and reverse-proxies /api/<service>/... to each microservice.
# Same origin for everything -> no CORS configuration needed in the Ballerina services.
server {
    listen 80;
    resolver 127.0.0.11 valid=10s;   # Docker DNS; resolve lazily so nginx starts even if a service is down

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    location ~ ^/api/(customer|restaurant|order|payment|delivery|notification|admin)/(.*)$ {
        set $svc $1;
        set $rest $2;
        set $port 8081;
        if ($svc = restaurant)   { set $port 8082; }
        if ($svc = order)        { set $port 8083; }
        if ($svc = payment)      { set $port 8084; }
        if ($svc = delivery)     { set $port 8085; }
        if ($svc = notification) { set $port 8086; }
        if ($svc = admin)        { set $port 8087; }
        proxy_pass http://$svc-service:$port/$rest$is_args$args;
        proxy_set_header Host $host;
    }
}
